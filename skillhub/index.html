<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic AI OPCP Labs - SkillHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p>Detecting language and redirecting...</p>
    </div>
    <noscript>
        <div class="noscript-fallback">
            <h1>Agentic AI OPCP Labs - SkillHub</h1>
            <p>JavaScript is required for automatic language detection. Please choose your language:</p>
            <ul>
                <li><a href="en/index.html">English</a></li>
                <li><a href="fr/index.html">Français</a></li>
            </ul>
        </div>
    </noscript>
    <script>
        (function () {
            'use strict';

            /**
             * Detect browser language and redirect to the appropriate locale folder.
             * Priority: stored preference > browser language > default (en)
             * Supported locales: "en", "fr"
             */
            function detectLocaleAndRedirect() {
                var locale = 'en'; // default

                // Check for stored preference first
                try {
                    var stored = localStorage.getItem('skillhub-locale');
                    if (stored === 'fr' || stored === 'en') {
                        locale = stored;
                        redirect(locale);
                        return;
                    }
                } catch (e) {
                    // localStorage unavailable, continue with browser detection
                }

                // Detect from browser language
                var browserLang = navigator.language || navigator.userLanguage || '';
                if (browserLang.toLowerCase().startsWith('fr')) {
                    locale = 'fr';
                }

                redirect(locale);
            }

            // Resolve the locale landing page relative to the SCO ROOT, not to the
            // (possibly trailing-slash-less) launch URL. SCORM Cloud serves the SCO
            // at a URL with no trailing slash (e.g. ".../scorm<hash>"), where a plain
            // relative "en/index.html" would resolve one directory ABOVE the SCO root
            // and 404. We branch on the final path segment: keep it as the SCO-root
            // directory unless it is an explicit *.html launch file (then strip it).
            function resolveLocaleTarget(pathname, locale) {
                var lastSeg = pathname.substring(pathname.lastIndexOf('/') + 1);
                var root;
                if (lastSeg === '') {
                    root = pathname;                       // already ends with "/"
                } else if (/\.html?$/i.test(lastSeg)) {
                    root = pathname.replace(/[^/]*$/, ''); // strip explicit launch file
                } else {
                    root = pathname + '/';                 // SCO-root dir segment -> keep it
                }
                return root + locale + '/index.html';
            }

            function redirect(locale) {
                window.location.replace(resolveLocaleTarget(window.location.pathname, locale));
            }

            detectLocaleAndRedirect();
        })();
    </script>
</body>
</html>
